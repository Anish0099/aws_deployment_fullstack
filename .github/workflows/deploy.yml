name: Build & Deploy to AWS (ECS Backend + S3/CloudFront Frontend)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Deploy Fullstack App
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # 1. ENSURE S3 TERRAFORM STATE BUCKET EXISTS
    - name: Ensure S3 Bucket Exists for Terraform State
      run: |
        BUCKET_NAME="my-app-tfstate-911167889594"
        if ! aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
          echo "Bucket does not exist. Creating S3 bucket $BUCKET_NAME..."
          aws s3 mb "s3://$BUCKET_NAME" --region ${{ secrets.AWS_REGION }}
        else
          echo "Bucket $BUCKET_NAME already exists."
        fi

    # 2. TERRAFORM APPLY & EXTRACT OUTPUTS
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      working-directory: ./infra
      run: terraform init

    - name: Terraform Apply
      working-directory: ./infra
      run: terraform apply -auto-approve

    - name: Save Terraform Outputs to Environment
      working-directory: ./infra
      run: |
        echo "S3_BUCKET=$(terraform output -raw s3_bucket_name)" >> $GITHUB_ENV
        echo "CLOUDFRONT_ID=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_ENV
        echo "ALB_DNS=$(terraform output -raw alb_dns_name)" >> $GITHUB_ENV

    # 3. BUILD & PUSH BACKEND TO ECR
    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, Tag, and Push Backend Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: my-app-backend
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./backend
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    # 4. REDEPLOY BACKEND ECS SERVICE
    - name: Force ECS Redeployment
      run: |
        aws ecs update-service --cluster production-cluster --service fullstack-service --force-new-deployment

    # 5. BUILD REACT FRONTEND
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Build Frontend Artifacts
      run: |
        cd frontend
        npm ci
        VITE_API_URL="http://${{ env.ALB_DNS }}/api" npm run build

    # 6. DEPLOY FRONTEND TO S3 & CLOUDFRONT
    - name: Sync Frontend Build to S3
      run: |
        aws s3 sync ./frontend/dist s3://${{ env.S3_BUCKET }} --delete

    - name: Invalidate CloudFront Cache
      run: |
        aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_ID }} --paths "/*"