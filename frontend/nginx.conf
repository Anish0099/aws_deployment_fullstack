server {
    listen 80;
    server_name localhost;

    # Where the React build files are located
    root /usr/share/nginx/html;
    index index.html;

    # Handle React Router (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Spring Boot backend
    # Because both containers share the same ECS Task, they communicate over localhost
    location /api/ {
        # REMOVED the trailing slash after 8080 so the /api prefix is passed to Spring Boot
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}